<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 芒果盃 🥭 x 飛べ 🏐</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- 引入 Babel 讓瀏覽器可以直接編譯 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        haikyu: {
                            50: '#fff8f1',
                            100: '#ffecd5',
                            200: '#ffd3a6',
                            300: '#ffb56d',
                            400: '#ff8c2c',
                            500: '#f96900', 
                            600: '#eb5200',
                            700: '#c33a02',
                        },
                        karasuno: '#212529' 
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    animation: {
                        'flip': 'flip 0.6s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out forwards',
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'slide-right': 'slideRight 0.4s ease-out forwards',
                        'float': 'float 3s ease-in-out infinite',
                        'smash': 'smash 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'spin-slow': 'spin 2s linear infinite',
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards'
                    },
                    keyframes: {
                        flip: {
                            '0%': { transform: 'rotateX(0)' },
                            '50%': { transform: 'rotateX(90deg)' },
                            '100%': { transform: 'rotateX(0)' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(100%)', opacity: 0 },
                            '100%': { transform: 'translateY(0)', opacity: 1 },
                        },
                        fadeIn: {
                            '0%': { opacity: 0 },
                            '100%': { opacity: 1 },
                        },
                        slideRight: {
                            '0%': { transform: 'translateX(-20px)', opacity: 0 },
                            '100%': { transform: 'translateX(0)', opacity: 1 },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        smash: {
                            '0%': { transform: 'scale(0.5) translateY(-50px)', opacity: 0 },
                            '100%': { transform: 'scale(1) translateY(0)', opacity: 1 },
                        },
                        pop: {
                            '0%': { transform: 'scale(0.8)', opacity: 0 },
                            '100%': { transform: 'scale(1)', opacity: 1 },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { 
            background-color: #fff8f1; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; /* 避免像網頁一樣誤選文字，提升 APP 質感 */
        }
        .selectable { user-select: text; }
        .tobe-banner {
            background-color: #212529;
            background-image: repeating-linear-gradient(45deg, #212529 25%, transparent 25%, transparent 75%, #212529 75%, #212529), repeating-linear-gradient(45deg, #212529 25%, #2a2e33 25%, #2a2e33 75%, #212529 75%, #212529);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ==========================================
        // 1. 資料區塊 
        // ==========================================
        const femalePlayers = [
            '施姵妤', '姜馨', '葉宸瑄', '洪梓珈', '蕭以若', '張采翎', 
            '張惠婷', '許靜瑜', '俞懷媃', '魏婉昀', '張立沂', '何蕙心', 
            '楊子儀', '王聖淳', '葉曉如', 'Covia', '曾琍婕', '陳怡瑄', 
            '魏子軒', 'Cpz'
        ];
        const getGenderIconColor = (name) => femalePlayers.includes(name) ? 'text-pink-400' : 'text-blue-400';

        const phase1Groups = {
            'A': ['王聖淳', '張惠婷', '楊筌凱', '張庭維'],
            'B': ['葉宸瑄', '翁定洋', '商復一', '邱元彥'],
            'C': ['張立沂', '洪梓珈', '賴福民', '何元瑜'],
            'D': ['許靜瑜', '葉曉如', '賴文逸', 'Andy'],
            'E': ['Cpz', '楊子儀', '陳兆鈞', '王茂世'],
            'F': ['蕭以若', '施姵妤', '林耿鋒', '游竣宇'],
            'G': ['陳怡瑄', '魏婉昀', '高嘉偉', '張祐綸'],
            'H': ['姜馨', '俞懷媃', '郭士偉', '洪華強'],
            'I': ['Covia', '曾俐婕', '李志培', '林子慶'],
            'J': ['張采翎', '何蕙心', '彭于鈞', '王俊穎'],
            'K': ['魏子軒', '陳哲銘', '陳證元', 'Dennis']
        };

        const phase2Groups = {
            'A': ['王聖淳', '葉宸瑄', '張立沂', '楊筌凱', '張庭維', '翁定洋', '高嘉偉'],
            'B': ['Cpz', '洪梓珈', '蕭以若', '林耿鋒', '彭于鈞', '郭士偉', '洪華強'],
            'C': ['施姵妤', '張采翎', '葉曉如', '賴福民', '何元瑜', '賴文逸'],
            'D': ['許靜瑜', 'Covia', '何蕙心', '李志培', '商復一', 'Andy'],
            'E': ['楊子儀', '姜馨', '魏婉昀', '邱元彥', '王俊穎', '張祐綸'],
            'F': ['曾琍婕', '陳怡瑄', '張惠婷', 'Dennis', '陳兆鈞', '陳哲銘'],
            'G': ['魏子軒', '俞懷媃', '陳證元', '林子慶', '王茂世', '游竣宇']
        };

        const scheduleData = [
            { time: "09:00 - 09:10", phase: 1, type: "warmup", desc: "場地暖身與規則說明" },
            { time: "09:10 - 09:27", phase: 1, A: { play: ['A','B','C'], split: 'A', ref: 'J' }, B: { play: ['D','E','F'], split: 'D', ref: 'G' } },
            { time: "09:27 - 09:44", phase: 1, A: { play: ['J','K','A'], split: 'J', ref: 'B' }, B: { play: ['G','H','I'], split: 'G', ref: 'C' } },
            { time: "09:44 - 10:01", phase: 1, A: { play: ['B','D','F'], split: 'B', ref: 'H' }, B: { play: ['C','E','G'], split: 'C', ref: 'I' } },
            { time: "10:01 - 10:18", phase: 1, A: { play: ['H','J','B'], split: 'H', ref: 'E' }, B: { play: ['I','K','C'], split: 'I', ref: 'A' } },
            { time: "10:18 - 10:35", phase: 1, A: { play: ['E','F','H'], split: 'E', ref: 'I' }, B: { play: ['A','D','G'], split: 'A', ref: 'K' } },
            { time: "10:35 - 10:52", phase: 1, A: { play: ['I','B','E'], split: 'I', ref: 'G' }, B: { play: ['K','C','F'], split: 'K', ref: 'A' } },
            { time: "10:52 - 11:09", phase: 1, A: { play: ['G','B','I'], split: 'G', ref: 'C' }, B: { play: ['J','A','H'], split: 'H', ref: 'D' } },
            { time: "11:09 - 11:26", phase: 1, A: { play: ['C','F','K'], split: 'F', ref: 'J' }, B: { play: ['D','H','J'], split: 'D', ref: 'E' } },
            { time: "11:26 - 11:43", phase: 1, A: { play: ['G','J','K'], split: 'J', ref: 'B' }, B: { play: ['E','I','A'], split: 'E', ref: 'F' } },
            { time: "11:43 - 12:00", phase: 1, A: { play: ['B','D','G'], split: 'B', ref: 'K' }, B: { play: ['C','F','H'], split: 'C', ref: 'I' } },
            { time: "12:00 - 12:15", phase: 2, type: "warmup", desc: "第二階段 6打6 佈達與隊友相見歡" },
            { time: "12:15 - 12:35", phase: 2, A: { play: ['A','B'], ref: 'C' }, B: { play: ['D','E'], ref: 'F' } },
            { time: "12:35 - 12:55", phase: 2, A: { play: ['C','G'], ref: 'A' }, B: { play: ['F','B'], ref: 'D' } },
            { time: "12:55 - 13:15", phase: 2, A: { play: ['D','A'], ref: 'G' }, B: { play: ['E','C'], ref: 'B' } },
            { time: "13:15 - 13:35", phase: 2, A: { play: ['G','B'], ref: 'E' }, B: { play: ['F','A'], ref: 'C' } },
            { time: "13:35 - 14:00", phase: 2, A: { play: ['C','D'], ref: 'F' }, B: { play: ['E','G'], ref: 'B' } }
        ];

        // ==========================================
        // 2. 核心 App 邏輯
        // ==========================================
        const App = () => {
            const [activeTab, setActiveTab] = useState('schedule');
            const [selectedPlayer, setSelectedPlayer] = useState('');
            const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
            const [currentTime, setCurrentTime] = useState(new Date());
            const [copyStatus, setCopyStatus] = useState('');

            // 抽籤系統
            const [drawGroup, setDrawGroup] = useState('A');
            const [isDrawing, setIsDrawing] = useState(false);
            const [drawResult, setDrawResult] = useState(null);

            // 新增：隊伍名單彈窗的狀態管理
            const [teamModalInfo, setTeamModalInfo] = useState({ isOpen: false, phase: 1, group: '' });
            const openTeamModal = (phase, group) => setTeamModalInfo({ isOpen: true, phase, group });

            useEffect(() => {
                const updateTime = () => {
                    const now = new Date();
                    // 為了方便主辦方預覽：如果今天不是5/24，則系統模擬時間為 09:35
                    if (now.getMonth() !== 4 || now.getDate() !== 24) {
                        setCurrentTime(new Date('2026-05-24T09:35:00'));
                    } else {
                        setCurrentTime(now);
                    }
                };
                updateTime();
                const timer = setInterval(updateTime, 60000);
                return () => clearInterval(timer);
            }, []);

            const getPlayerGroup = (playerName, phase) => {
                const groups = phase === 1 ? phase1Groups : phase2Groups;
                for (const [group, players] of Object.entries(groups)) {
                    if (players.includes(playerName)) return group;
                }
                return null;
            };

            const parseTime = (timeStr) => {
                const [h, m] = timeStr.split(':').map(Number);
                return new Date(currentTime).setHours(h, m, 0, 0);
            };

            const isCurrentTimeslot = (timeStr) => {
                const [start, end] = timeStr.split(' - ');
                const startTime = parseTime(start);
                const endTime = parseTime(end);
                const now = currentTime.getTime();
                return now >= startTime && now < endTime;
            };

            const getActionForSlot = (slot, p1Group, p2Group) => {
                const group = slot.phase === 1 ? p1Group : p2Group;
                if (!group) return { title: "無賽程", desc: "自由活動", color: "bg-gray-100", icon: "fa-mug-hot", type: 'rest' };
                
                if (slot.type === "warmup") {
                    return { title: slot.desc, desc: "請至場上集合", color: "bg-blue-100 text-blue-800 border-blue-300", icon: "fa-bullhorn", type: 'info' };
                }

                for (const court of ['A', 'B']) {
                    const courtData = slot[court];
                    if (!courtData) continue;

                    if (courtData.play.includes(group)) {
                        if (slot.phase === 1 && courtData.split === group) {
                            return { title: `在 ${court} 場地 ⚠️ 拆分上場`, desc: "請拆成2+2加入另外兩隊：", interactiveGroups: courtData.play.filter(g => g !== group), phase: slot.phase, color: "bg-haikyu-100 text-haikyu-900 border-haikyu-400 ring-2 ring-haikyu-400", icon: "fa-people-arrows", type: 'play' };
                        }
                        const mates = courtData.play.filter(g => g !== group);
                        return { title: `在 ${court} 場地 🔥 上場比賽`, desc: slot.phase === 1 ? `共用場地：` : `對戰隊伍：`, interactiveGroups: mates, phase: slot.phase, color: "bg-karasuno text-white shadow-md", icon: "fa-volleyball", type: 'play' };
                    } else if (courtData.ref === group) {
                        return { title: `在 ${court} 場地 📋 擔任計分`, desc: "場上隊伍：", interactiveGroups: courtData.play, phase: slot.phase, color: "bg-red-50 text-red-800 border border-red-200", icon: "fa-clipboard-list", type: 'ref' };
                    }
                }
                return { title: "休息時間 ☕️", desc: "趁機補充水分、看別人打球", color: "bg-white text-gray-500 border border-gray-200", icon: "fa-mug-hot", type: 'rest' };
            };

            const handleCopySchedule = () => {
                const p1Group = getPlayerGroup(selectedPlayer, 1);
                const p2Group = getPlayerGroup(selectedPlayer, 2);
                let textToCopy = `🏐 2026 芒果盃 - ${selectedPlayer} 的專屬賽程 🏐\n`;
                textToCopy += `[Phase1: ${p1Group}組 | Phase2: ${p2Group}組]\n\n`;
                
                scheduleData.forEach(slot => {
                    const action = getActionForSlot(slot, p1Group, p2Group);
                    textToCopy += `⏱ ${slot.time} - ${action.title}\n`;
                });

                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(textToCopy).then(() => showCopySuccess());
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = textToCopy;
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    try { document.execCommand('copy'); showCopySuccess(); } catch (err) {}
                    document.body.removeChild(textArea);
                }
            };

            const showCopySuccess = () => { 
                setCopyStatus('已複製到剪貼簿！'); 
                setTimeout(() => setCopyStatus(''), 2000); 
            };

            const handleDrawSplit = () => {
                setIsDrawing(true);
                setDrawResult(null);
                setTimeout(() => {
                    const members = [...phase1Groups[drawGroup]];
                    for (let i = members.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [members[i], members[j]] = [members[j], members[i]];
                    }
                    setDrawResult({ team1: [members[0], members[1]], team2: [members[2], members[3]] });
                    setIsDrawing(false);
                }, 1500); 
            };

            // ==========================================
            // UI 渲染區塊
            // ==========================================

            const renderScheduleTab = () => {
                const p1Group = getPlayerGroup(selectedPlayer, 1);
                const p2Group = getPlayerGroup(selectedPlayer, 2);

                const currentSlotIndex = scheduleData.findIndex(slot => isCurrentTimeslot(slot.time));
                const currentSlot = currentSlotIndex !== -1 ? scheduleData[currentSlotIndex] : null;
                const currentAction = currentSlot && selectedPlayer ? getActionForSlot(currentSlot, p1Group, p2Group) : null;
                
                let nextSlot = null; let nextAction = null; let minutesUntilNext = null;
                if (selectedPlayer) {
                    if (currentSlotIndex !== -1 && currentSlotIndex + 1 < scheduleData.length) {
                        nextSlot = scheduleData[currentSlotIndex + 1];
                    } else if (currentSlotIndex === -1) {
                        nextSlot = scheduleData.find(slot => parseTime(slot.time.split(' - ')[0]) > currentTime.getTime());
                    }
                    if (nextSlot) {
                        nextAction = getActionForSlot(nextSlot, p1Group, p2Group);
                        const nextStartTime = parseTime(nextSlot.time.split(' - ')[0]);
                        minutesUntilNext = Math.ceil((nextStartTime - currentTime.getTime()) / 60000);
                    }
                }

                if (!selectedPlayer) {
                    return (
                        <div className="flex flex-col items-center justify-center h-[70vh] px-6 text-center animate-fade-in">
                            <div className="relative mb-6">
                                <i className="fas fa-volleyball-ball text-6xl text-haikyu-400 animate-float"></i>
                                <div className="absolute -bottom-2 -right-2 bg-karasuno text-white w-8 h-8 rounded-full flex items-center justify-center animate-bounce shadow-lg">
                                    <i className="fas fa-hand-pointer text-sm"></i>
                                </div>
                            </div>
                            <h2 className="text-2xl font-black text-karasuno mb-3 animate-slide-up">專屬賽事系統啟動！</h2>
                            <p className="text-gray-600 mb-8 font-medium leading-relaxed animate-slide-up" style={{animationDelay: '0.1s'}}>點擊右上角頭像綁定你的身分，<br/>掌握整天每一分每一秒的動向！</p>
                            <button 
                                onClick={() => setIsProfileModalOpen(true)}
                                className="bg-haikyu-500 text-white font-black text-lg px-8 py-4 rounded-full shadow-lg transform transition active:scale-95 flex items-center animate-smash"
                                style={{animationDelay: '0.2s'}}
                            >
                                綁定參賽者身分 <i className="fas fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    );
                }

                return (
                    <div className="p-4 pb-24">
                        <div className="flex justify-between items-end mb-4 animate-slide-right">
                            <div className="flex gap-2">
                                <button onClick={() => openTeamModal(1, p1Group)} className="bg-karasuno text-white px-3 py-2 rounded-lg shadow text-center transform hover:-translate-y-1 transition active:scale-95">
                                    <div className="text-[10px] text-haikyu-400 font-bold mb-0.5">P1 (前3hr) <i className="fas fa-search ml-1"></i></div>
                                    <div className="text-xl font-black">{p1Group} <span className="text-sm">組</span></div>
                                </button>
                                <button onClick={() => openTeamModal(2, p2Group)} className="bg-haikyu-500 text-white px-3 py-2 rounded-lg shadow text-center transform hover:-translate-y-1 transition active:scale-95">
                                    <div className="text-[10px] text-haikyu-100 font-bold mb-0.5">P2 (後2hr) <i className="fas fa-search ml-1"></i></div>
                                    <div className="text-xl font-black">{p2Group} <span className="text-sm">組</span></div>
                                </button>
                            </div>
                            <button 
                                onClick={handleCopySchedule}
                                className="text-xs bg-white text-karasuno border border-gray-300 px-3 py-2 rounded-lg font-bold shadow-sm active:bg-gray-100 flex items-center transition"
                            >
                                {copyStatus ? <><i className="fas fa-check text-green-500 mr-1"></i> {copyStatus}</> : <><i className="fas fa-share-alt mr-1 text-haikyu-500"></i> 分享賽程</>}
                            </button>
                        </div>

                        {currentAction ? (
                            <div className="mb-4 bg-white rounded-2xl shadow-lg border-2 border-haikyu-500 overflow-hidden transform transition-all animate-smash">
                                <div className="bg-haikyu-500 text-white px-4 py-2 font-black text-sm flex justify-between items-center">
                                    <span className="tracking-widest flex items-center"><i className="fas fa-fire mr-1 animate-pulse"></i> 正在進行</span>
                                    <span>{currentSlot.time}</span>
                                </div>
                                <div className="p-5 text-center bg-gradient-to-b from-white to-orange-50">
                                    <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white shadow-inner mb-3 border-4 border-orange-100">
                                        <i className={`fas ${currentAction.icon} text-3xl text-haikyu-600 ${currentAction.type === 'play' ? 'animate-bounce' : ''}`}></i>
                                    </div>
                                    <h3 className="text-2xl font-black text-karasuno mb-1">{currentAction.title}</h3>
                                    <p className="text-gray-700 font-bold text-sm bg-white inline-block px-3 py-1 rounded-full border border-gray-200 shadow-sm">
                                        {currentAction.desc}
                                        {currentAction.interactiveGroups && currentAction.interactiveGroups.map((g, i) => (
                                            <span key={g}>
                                                <span onClick={(e) => { e.stopPropagation(); openTeamModal(currentAction.phase, g); }} className="mx-1 text-haikyu-600 underline cursor-pointer active:text-haikyu-800">
                                                    {g}組
                                                </span>
                                                {i < currentAction.interactiveGroups.length - 1 ? '、' : ''}
                                            </span>
                                        ))}
                                    </p>
                                </div>
                            </div>
                        ) : (
                            <div className="mb-4 bg-gray-200 rounded-xl p-4 text-center border border-gray-300 shadow-inner animate-fade-in">
                                <p className="text-gray-600 font-bold"><i className="fas fa-bed mr-1"></i> 目前非賽事時間或賽程已結束</p>
                            </div>
                        )}

                        {nextSlot && (
                            <div className="mb-8 bg-karasuno text-white rounded-xl p-3 shadow-md flex items-center justify-between border-l-4 border-haikyu-400 animate-slide-right" style={{animationDelay: '0.1s'}}>
                                <div className="flex items-center">
                                    <i className="fas fa-forward text-haikyu-400 mr-3 text-lg animate-pulse"></i>
                                    <div>
                                        <div className="text-[10px] text-gray-400 font-bold mb-0.5 uppercase">Next Up ({nextSlot.time})</div>
                                        <div className="font-bold text-sm">{nextAction.title}</div>
                                    </div>
                                </div>
                                {minutesUntilNext !== null && minutesUntilNext <= 60 && (
                                    <div className="text-right">
                                        <span className="text-xs text-gray-400 block">距下一場剩餘</span>
                                        <span className="font-black text-haikyu-400 text-lg">{minutesUntilNext} <span className="text-xs">分</span></span>
                                    </div>
                                )}
                            </div>
                        )}

                        <div className="relative before:absolute before:inset-0 before:ml-5 before:h-full before:w-1 before:bg-haikyu-200">
                            {scheduleData.map((slot, idx) => {
                                const action = getActionForSlot(slot, p1Group, p2Group);
                                const isActive = isCurrentTimeslot(slot.time);
                                const isPast = parseTime(slot.time.split(' - ')[1]) <= currentTime.getTime();

                                return (
                                    <div key={idx} className={`relative flex items-start mb-6 transition-all duration-300 animate-slide-right ${isPast && !isActive ? 'opacity-40 grayscale-[30%]' : ''}`} style={{animationDelay: `${idx * 0.05}s`}}>
                                        <div className={`flex items-center justify-center w-11 h-11 rounded-full border-4 border-[#fff8f1] shrink-0 z-10 transition-transform 
                                            ${isActive ? 'bg-haikyu-500 scale-110 shadow-[0_0_15px_rgba(249,105,0,0.5)]' : (isPast ? 'bg-gray-300' : 'bg-karasuno')} text-white shadow`}>

                                    <div key={group} className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm transform hover:-translate-y-1 transition-transform">
                                        <div className="bg-haikyu-100 text-haikyu-800 font-black px-4 py-2 text-sm border-b border-haikyu-200 flex justify-between items-center">
                                            <span>{group} 組</span>
                                        </div>
                                        <div className="grid grid-cols-2 divide-x divide-y divide-gray-100">
                                            {players.map(p => (
                                                <button 
                                                    key={p} 
                                                    onClick={() => {
                                                        setSelectedPlayer(p);
                                                        setIsProfileModalOpen(false);
                                                        setActiveTab('schedule');
                                                    }}
                                                    className={`py-3 px-2 font-bold text-sm flex items-center justify-center transition-all duration-200 ${selectedPlayer === p ? 'bg-haikyu-500 text-white shadow-inner scale-105 z-10' : 'hover:bg-gray-50 text-karasuno active:bg-gray-100'}`}
                                                >
                                                    <i className={`fas ${femalePlayers.includes(p) ? 'fa-female' : 'fa-male'} text-lg mr-2 ${selectedPlayer === p ? 'text-white' : getGenderIconColor(p)}`}></i>
                                                    {p}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            // 新增：隊伍名單彈窗組件
            const TeamModal = () => {
                if (!teamModalInfo.isOpen) return null;
                const players = teamModalInfo.phase === 1 ? phase1Groups[teamModalInfo.group] : phase2Groups[teamModalInfo.group];
                return (
                    <div className="fixed inset-0 z-[120] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity" onClick={() => setTeamModalInfo({...teamModalInfo, isOpen: false})}>
                        <div className="bg-white rounded-2xl w-full max-w-[300px] shadow-2xl animate-pop overflow-hidden flex flex-col" onClick={e => e.stopPropagation()}>
                            <div className="bg-karasuno text-white p-4 flex justify-between items-center border-b-4 border-haikyu-500">
                                <div>
                                    <span className="text-[10px] text-haikyu-400 font-bold uppercase tracking-wider block mb-0.5">Phase {teamModalInfo.phase}</span>
                                    <h3 className="font-black text-xl">{teamModalInfo.group} 組名單</h3>
                                </div>
                                <button onClick={() => setTeamModalInfo({...teamModalInfo, isOpen: false})} className="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition active:scale-95">
                                    <i className="fas fa-times"></i>
                                </button>
                            </div>
                            <div className="p-5 grid grid-cols-2 gap-3 bg-gray-50">
                                {players && players.map(p => (
                                    <div key={p} className={`flex items-center p-2 rounded-lg border shadow-sm ${selectedPlayer === p ? 'bg-haikyu-100 border-haikyu-300' : 'bg-white border-gray-200'}`}>
                                        <i className={`fas ${femalePlayers.includes(p) ? 'fa-female text-pink-400' : 'fa-male text-blue-400'} text-lg mr-2 ${selectedPlayer === p ? 'text-haikyu-600' : ''}`}></i>
                                        <span className={`font-bold text-sm ${selectedPlayer === p ? 'text-haikyu-800' : 'text-karasuno'}`}>{p}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            // Tabs 設定
            const tabs = [
                { id: 'schedule', icon: 'fa-clipboard-user', label: '個人賽程' },
                { id: 'groups', icon: 'fa-users', label: '分組名單' },
                { id: 'draw', icon: 'fa-random', label: '拆分抽籤' },
                { id: 'info', icon: 'fa-book-open', label: '大會資訊' }
            ];

            return (
                <div className="min-h-screen relative font-sans max-w-lg mx-auto bg-haikyu-50 shadow-2xl flex flex-col">
                    {/* Header */}
                    <header className="bg-karasuno px-4 py-3 sticky top-0 z-50 flex justify-between items-center shadow-lg">
                        <div className="font-black text-xl text-white tracking-widest flex items-center cursor-pointer" onClick={() => window.scrollTo({top:0, behavior:'smooth'})}>
                            <span className="text-haikyu-500 mr-2 text-2xl animate-pulse">🥭</span> 芒果盃
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="text-gray-400 text-xs font-black hidden sm:block bg-gray-800 px-2 py-1 rounded">
                                <i className="far fa-clock mr-1"></i> {currentTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                            </div>
                            <button 
                                onClick={() => setIsProfileModalOpen(true)}
                                className="bg-white/10 hover:bg-white/20 transition px-3 py-1.5 rounded-full flex items-center border border-white/20 shadow-inner active:scale-95"
                            >
                                {selectedPlayer ? (
                                    <>
                                        <i className={`fas ${femalePlayers.includes(selectedPlayer) ? 'fa-female' : 'fa-male'} mr-2 text-lg ${getGenderIconColor(selectedPlayer)}`}></i>
                                        <span className="font-bold text-white text-sm">{selectedPlayer}</span>
                                    </>
                                ) : (
                                    <>
                                        <i className="fas fa-user-plus mr-2 text-haikyu-400 animate-bounce"></i>
                                        <span className="font-bold text-white text-sm">選擇身分</span>
                                    </>
                                )}
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area: 移除 overflow-y-auto 讓外層 body 自然滾動 */}
                    <main className="flex-1 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] pb-28">
                        {activeTab === 'schedule' && renderScheduleTab()}
                        {activeTab === 'groups' && renderGroupsTab()}
                        {activeTab === 'draw' && renderDrawTab()}
                        {activeTab === 'info' && renderInfoTab()}
                    </main>

                    <ProfileModal />
                    <TeamModal />

                    {/* Bottom Navigation: 修正 fixed 定位，讓其不受父層影響 */}
                    <nav className="fixed bottom-0 left-0 right-0 mx-auto w-full max-w-lg bg-white border-t border-gray-200 flex justify-around items-center pb-safe z-40 shadow-[0_-10px_25px_-5px_rgba(0,0,0,0.15)]">
                        {tabs.map(tab => (
                            <button 
                                key={tab.id}
                                onClick={() => window.scrollTo(0,0) || setActiveTab(tab.id)}
                                className={`flex flex-col items-center py-2.5 w-1/4 transition-all relative ${activeTab === tab.id ? 'text-haikyu-500 bg-orange-50/50' : 'text-gray-400 hover:text-gray-600 active:bg-gray-50'}`}
                            >
                                {activeTab === tab.id && <div className="absolute top-0 w-3/4 h-1 bg-haikyu-500 rounded-b-md shadow-[0_2px_4px_rgba(249,105,0,0.3)] animate-smash"></div>}
                                <i className={`fas ${tab.icon} text-xl mb-1 ${activeTab === tab.id ? 'animate-bounce mt-1 text-haikyu-600' : 'mt-1'}`}></i>
                                <span className="text-[10px] font-black tracking-widest">{tab.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
